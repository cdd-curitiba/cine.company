<style>
:root{
  --bg:#060E16;
  --surface:#0E1A26;
  --surface2:#16283A;
  --line:#1E344A;
  --cyan:#22C8ED;
  --cyan-deep:#0B7EA8;
  --text:#E8F4F8;
  --muted:#7E97A8;
  --danger:#FF5C6E;
  --warn:#FFC24B;
  --ok:#3DDC91;
  --r:14px;
  --ui:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:calc(15px * var(--ui));
  overflow:hidden;
  overscroll-behavior:none;
}
h1,h2,h3,.brandtxt{font-family:'Sora',sans-serif;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1E344A;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- SPLASH / LOGIN ---------- */
#gate{position:fixed;inset:0;z-index:92;background:
  radial-gradient(90% 60% at 50% 0%,rgba(34,200,237,.14),transparent 70%),var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#gate .logo-wrap img{height:60px}
#splash{position:fixed;inset:0;z-index:90;display:none;background:
  radial-gradient(90% 60% at 50% 0%,rgba(34,200,237,.14),transparent 70%),var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.logo-wrap{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo-wrap img{height:60px;width:auto}
.brandtxt{font-weight:700;font-size:1.5rem;letter-spacing:.22em;text-transform:uppercase}
.brandtxt b{color:var(--cyan);font-weight:800}
.splash-sub{color:var(--muted);font-size:.9rem;margin:6px 0 28px;text-align:center}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);transition:.2s}
.tabs button.on{background:var(--cyan);color:#04121A}
label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px;font-weight:600}
input[type=text],input[type=password]{width:100%;background:#08131D;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--text);font-size:.95rem}
input:focus{border-color:var(--cyan);outline:none}
.btn{display:block;width:100%;text-align:center;background:var(--cyan);color:#04121A;font-weight:700;padding:15px;border-radius:11px;margin-top:20px;font-size:.95rem;transition:.15s}
.btn:hover{background:#4BD8F7}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.ghost:hover{border-color:var(--cyan)}
.saved{margin-top:18px;width:100%;max-width:420px}
.saved h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;font-weight:600}
.saved-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.saved-item:hover{border-color:var(--cyan)}
.saved-item .nm{flex:1;min-width:0}
.saved-item .nm b{display:block;font-size:.92rem;font-weight:600}
.saved-item .nm span{font-size:.75rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.62rem;font-weight:700;letter-spacing:.1em;padding:4px 8px;border-radius:20px;background:rgba(34,200,237,.14);color:var(--cyan)}
.del{color:var(--muted);padding:6px}
.del:hover{color:var(--danger)}
.err{background:rgba(255,92,110,.1);border:1px solid rgba(255,92,110,.4);color:#FFB3BC;padding:11px 13px;border-radius:10px;font-size:.85rem;margin-top:14px;display:none}
.err.show{display:block}

/* ---------- LOADING ---------- */
#loader{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
#loader.show{display:flex}
.spin{width:44px;height:44px;border:3px solid rgba(34,200,237,.2);border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loadTxt{font-weight:600}
#loadSub{color:var(--muted);font-size:.82rem;max-width:320px}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar img{height:30px;width:auto}
.topbar .brandtxt{font-size:.95rem}
.spacer{flex:1}
.icobtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icobtn:hover{background:var(--surface2);color:var(--cyan)}
.searchbox{display:flex;align-items:center;gap:8px;background:#08131D;border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:280px;flex:1}
.searchbox input{background:none;border:none;color:var(--text);width:100%;font-size:.88rem}
.searchbox input:focus{outline:none}
@media(max-width:700px){.searchbox{max-width:none}.topbar img{height:26px}}

.body{flex:1;display:flex;min-height:0}
.side{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
.side .navi{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;width:100%;color:var(--muted);font-weight:600;font-size:.88rem;margin-bottom:2px;text-align:left}
.side .navi.on{background:rgba(34,200,237,.12);color:var(--cyan)}
.side .navi:hover{color:var(--text)}
.side .sect{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#4A6273;font-weight:700;padding:16px 13px 8px}
.main{flex:1;display:flex;min-width:0}
.tabbar{display:none}
@media(max-width:860px){
  .side{display:none}
  .tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--muted);font-size:.63rem;font-weight:600}
  .tabbar button.on{color:var(--cyan)}
}

/* ---------- CATEGORY + LIST PANES ---------- */
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.cats{width:230px;flex-shrink:0;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.cat{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border-radius:9px;text-align:left;font-size:.85rem;color:var(--muted);font-weight:500}
.cat:hover{background:var(--surface)}
.cat.on{background:var(--surface2);color:var(--text);font-weight:600}
.cat .ct{margin-left:auto;font-size:.68rem;color:#4A6273}
.chlist{flex:1;overflow-y:auto;padding:10px}
.row{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;width:100%;text-align:left;cursor:pointer}
.row:hover{background:var(--surface)}
.row.on{background:rgba(34,200,237,.1)}
.row .num{font-size:.72rem;color:#4A6273;min-width:34px;font-weight:700}
.row img{width:40px;height:40px;object-fit:contain;border-radius:7px;background:#08131D;flex-shrink:0}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:.87rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt span{font-size:.73rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .star{color:#3E5668;padding:6px;font-size:1rem}
.row .star.on{color:var(--cyan)}
.warnico{color:var(--warn);font-size:.8rem}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:.87rem}

/* ---------- PLAYER ---------- */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#03080D}
.videowrap{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.videowrap video{width:100%;height:100%;object-fit:contain;background:#000}
.vstate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(3,8,13,.9);text-align:center;padding:20px}
.vstate.show{display:flex}
.vstate p{font-size:.85rem;color:var(--muted);max-width:340px}
.nowbar{padding:14px 16px;border-bottom:1px solid var(--line)}
.nowbar h3{font-size:1.02rem;font-weight:600}
.nowbar .meta{font-size:.75rem;color:var(--muted);margin-top:3px}
.epg{flex:1;overflow-y:auto;padding:12px 16px}
.epg h4{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#4A6273;margin-bottom:10px;font-weight:700}
.prog{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(30,52,74,.5)}
.prog .tm{font-size:.75rem;color:var(--cyan);min-width:46px;font-weight:700}
.prog .pd b{display:block;font-size:.85rem;font-weight:500}
.prog .pd span{font-size:.76rem;color:var(--muted)}
.prog.live{background:rgba(34,200,237,.06);border-radius:8px;padding:9px 10px}

/* ---------- VOD GRID ---------- */
.grid{flex:1;overflow-y:auto;padding:14px}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
@media(max-width:520px){.gwrap{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}}
.poster{cursor:pointer}
.poster .ph{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.poster .ph img{width:100%;height:100%;object-fit:cover}
.poster:hover .ph{border-color:var(--cyan)}
.poster .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#334D61;font-size:1.6rem}
.poster b{display:block;font-size:.78rem;font-weight:500;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid h3{font-family:'Sora';font-size:1rem;margin-bottom:12px;font-weight:600}
.sentinel{height:40px}

/* ---------- MODAL / SHEET ---------- */
.mask{position:fixed;inset:0;background:rgba(3,8,13,.82);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:22px}
.sheet h3{font-size:1.1rem;margin-bottom:6px}
.sheet p{font-size:.86rem;color:var(--muted);line-height:1.55}
.sheet .close{position:sticky;top:0;float:right;color:var(--muted);font-size:1.3rem;line-height:1}
.seasons{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 12px}
.seasons button{padding:8px 14px;border-radius:8px;background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted)}
.seasons button.on{background:var(--cyan);color:#04121A}
.ep{display:flex;align-items:center;gap:11px;padding:11px;border-radius:9px;width:100%;text-align:left}
.ep:hover{background:var(--surface2)}
.ep .n{font-size:.75rem;color:var(--cyan);font-weight:700;min-width:30px}
.ep b{font-size:.85rem;font-weight:500}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row b{font-size:.9rem;font-weight:600;display:block}
.set-row span{font-size:.76rem;color:var(--muted)}
.sw{width:48px;height:27px;border-radius:20px;background:var(--surface2);position:relative;flex-shrink:0;transition:.2s}
.sw.on{background:var(--cyan)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:24px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:8px;background:var(--surface2);font-weight:700}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:11px;font-size:.85rem;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
body.tvmode{--ui:1.25}
body.tvmode .row.kfoc,body.tvmode .cat.kfoc,body.tvmode .poster.kfoc{outline:3px solid var(--cyan);outline-offset:2px;border-radius:11px}
.fs .videowrap{aspect-ratio:auto;height:100%}
.fs .stage{position:fixed;inset:0;z-index:70}
.fs .nowbar,.fs .epg{display:none}
#ovStage{position:fixed;inset:0;z-index:75;background:#03080D;display:flex;flex-direction:column}
#ovStage .closeov{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:3;background:rgba(6,14,22,.75);border:1px solid var(--line)}
</style>
</head>
<body>


<div id="gate">
  <div class="logo-wrap"><img id="logoGate" src="" alt="Cine Company"></div>
  <div class="splash-sub">Entre com o acesso que você recebeu</div>
  <div class="card">
    <label>Usuário</label>
    <input type="text" id="gUser" autocomplete="username" spellcheck="false">
    <label>Senha</label>
    <input type="password" id="gPass" autocomplete="current-password">
    <div class="err" id="gErr"></div>
    <button class="btn" id="gBtn" onclick="entrar()">Entrar</button>
    <p style="font-size:.78rem;color:var(--muted);margin-top:14px;text-align:center">
      Não tem acesso? Fale com quem vendeu seu plano.</p>
  </div>
</div>

<!-- ============ SPLASH / CONECTAR LISTA ============ -->
<div id="splash">
  <div class="logo-wrap">
    <img id="logoSplash" src="" alt="Cine Company">
  </div>
  <div class="splash-sub">Conecte sua lista e comece a assistir</div>

  <div class="card">
    <div class="tabs">
      <button id="tabM3u" class="on" onclick="setMode('m3u')">Lista M3U</button>
      <button id="tabXt" onclick="setMode('xtream')">Xtream Codes</button>
    </div>

    <div id="formM3u">
      <label>Nome da lista</label>
      <input type="text" id="m3uName" placeholder="Minha lista" autocomplete="off">
      <label>URL da lista (.m3u / .m3u8)</label>
      <input type="text" id="m3uUrl" placeholder="http://servidor.com/get.php?..." autocomplete="off" spellcheck="false">
    </div>

    <div id="formXt" style="display:none">
      <label>Nome da lista</label>
      <input type="text" id="xtName" placeholder="Minha lista" autocomplete="off">
      <label>Servidor (DNS)</label>
      <input type="text" id="xtHost" placeholder="http://servidor.com:8080" autocomplete="off" spellcheck="false">
      <label>Usuário</label>
      <input type="text" id="xtUser" autocomplete="off" spellcheck="false">
      <label>Senha</label>
      <input type="password" id="xtPass" autocomplete="off">
    </div>

    <div class="err" id="loginErr"></div>
    <button class="btn" onclick="connect()">Conectar</button>
  </div>

  <div class="saved" id="savedWrap" style="display:none">
    <h4>Listas neste aparelho</h4>
    <div id="savedList"></div>
  </div>
</div>

<!-- ============ LOADER ============ -->
<div id="loader">
  <div class="spin"></div>
  <div id="loadTxt">Carregando sua lista...</div>
  <div id="loadSub">Listas grandes podem levar até um minuto. Não feche a página.</div>
  <div id="loadProg" class="mono" style="color:var(--cyan);font-weight:700"></div>
  <button class="btn ghost" style="max-width:220px" onclick="cancelarCarga()">Cancelar</button>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <img id="logoTop" src="" alt="Cine Company">
    <div class="spacer"></div>
    <div class="searchbox">
      <span style="color:var(--muted)">⌕</span>
      <input type="text" id="search" placeholder="Buscar canal, filme ou série" autocomplete="off">
    </div>
    <button class="icobtn" title="Recarregar" onclick="reloadList()">⟳</button>
    <button class="icobtn" title="Ajustes" onclick="openSettings()">⚙</button>
  </div>

  <div class="body">
    <nav class="side">
      <div class="sect">Conteúdo</div>
      <button class="navi on" data-tab="live" onclick="go('live')">▶ TV ao Vivo</button>
      <button class="navi" data-tab="vod" onclick="go('vod')">▣ Filmes</button>
      <button class="navi" data-tab="series" onclick="go('series')">☰ Séries</button>
      <button class="navi" data-tab="fav" onclick="go('fav')">★ Favoritos</button>
      <div class="sect">Conta</div>
      <button class="navi" onclick="changeList()">⇄ Mudar lista</button>
      <button class="navi" onclick="openHelp()">? Avisos</button>
    </nav>

    <div class="main" id="main"></div>
  </div>

  <div class="tabbar">
    <button class="on" data-tab="live" onclick="go('live')"><span>▶</span>Ao Vivo</button>
    <button data-tab="vod" onclick="go('vod')"><span>▣</span>Filmes</button>
    <button data-tab="series" onclick="go('series')"><span>☰</span>Séries</button>
    <button data-tab="fav" onclick="go('fav')"><span>★</span>Favoritos</button>
    <button data-tab="set" onclick="openSettings()"><span>⚙</span>Ajustes</button>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- rede (com proxy opcional para CORS) ---------- */
function px(u){
  const base=(S.cfg.proxy||API).replace(/\/$/,'');
  return base+'/?t='+encodeURIComponent(S.ses?S.ses.token:'')+'&url='+encodeURIComponent(u);
}
async function grab(u,type,limite=45000){
  const ctrl=new AbortController();
  S.abort=ctrl;
  const relogio=setTimeout(()=>ctrl.abort('tempo'), limite);
  try{
    let r = await fetch(px(u), {cache:'no-store', signal:ctrl.signal});
    if(r.status===401 && await renovarSessao()){
      r = await fetch(px(u), {cache:'no-store', signal:ctrl.signal});
    }
    if(r.status===401){ sessaoCaiu(); throw new Error('Sessão expirada') }
    if(!r.ok) throw new Error('HTTP '+r.status);
    return type==='json' ? r.json() : r.text();
  }finally{ clearTimeout(relogio); if(S.abort===ctrl) S.abort=null }
}

/* ---------- cache local da lista (IndexedDB) ---------- */
function db(){
  return new Promise((ok,err)=>{
    const r=indexedDB.open('cinecompany',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('listas');
    r.onsuccess=()=>ok(r.result); r.onerror=()=>err(r.error);
  });
}
async function cacheSalvar(id,dados){
  try{
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    const d=await db();
    await new Promise((ok,err)=>{
      const t=d.transaction('listas','readwrite');
      t.objectStore('listas').put(dados,id);
      t.oncomplete=ok; t.onerror=()=>err(t.error); t.onabort=()=>err(t.error||new Error('abortado'));
    });
    console.log('[Cine] lista guardada no cache:', id);
  }catch(e){
    console.error('[Cine] falha ao guardar cache:', e);
    toast('Não consegui guardar a lista neste aparelho. Ela vai baixar de novo na próxima vez.');
  }
}
async function cacheLer(id){
  try{
    const d=await db();
    return await new Promise((ok)=>{
      const r=d.transaction('listas','readonly').objectStore('listas').get(id);
      r.onsuccess=()=>ok(r.result||null); r.onerror=()=>ok(null);
    });
  }catch(e){ return null }
}
const CACHE_HORAS = 12;

/* baixa texto grande mostrando progresso e permitindo cancelar */
async function grabTexto(u, ocioso=60000){
  S.abort = new AbortController();
  let relogio = setTimeout(()=>S.abort.abort('tempo'), ocioso);
  const renova = ()=>{ clearTimeout(relogio); relogio=setTimeout(()=>S.abort.abort('tempo'), ocioso) };
  try{
    let r = await fetch(px(u), {cache:'no-store', signal:S.abort.signal});
    if(r.status===401 && await renovarSessao()){
      r = await fetch(px(u), {cache:'no-store', signal:S.abort.signal});
    }
    if(r.status===401){ sessaoCaiu(); throw new Error('Sessão expirada') }
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(!r.body) return await r.text();
    const leitor = r.body.getReader(), dec = new TextDecoder('utf-8');
    let txt='', bytes=0, marca=0;
    for(;;){
      const {done, value} = await leitor.read();
      if(done) break;
      renova();
      bytes += value.length;
      S.ultBytes = bytes;
      txt += dec.decode(value, {stream:true});
      if(bytes - marca > 262144){
        marca = bytes;
        const el=$('loadProg'); if(el) el.textContent=(bytes/1048576).toFixed(1)+' MB';
      }
    }
    txt += dec.decode();
    if(bytes < 1024) throw new Error('servidor devolveu resposta vazia');
    return txt;
  }finally{ clearTimeout(relogio); S.abort=null; const el=$('loadProg'); if(el) el.textContent='' }
}
function cancelarCarga(){
  if(S.abort) S.abort.abort('cancelado');
  busy(false);
  $('splash').style.display='flex';
  drawSaved();
}

/* =========================================================
   ACESSO DO CLIENTE
   ========================================================= */
function idAparelho(){
  let d=localStorage.getItem('cc_dev');
  if(!d){ d=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()).slice(0,36); localStorage.setItem('cc_dev',d) }
  return d;
}
async function entrar(){
  const b=$('gBtn'), e=$('gErr');
  const usuario=$('gUser').value.trim().toLowerCase(), senha=$('gPass').value;
  if(!usuario||!senha){ e.textContent='Preencha usuário e senha.'; e.classList.add('show'); return }
  b.textContent='Entrando...'; e.classList.remove('show');
  try{
    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({usuario,senha,dispositivo:idAparelho()})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.erro||'Não foi possível entrar');
    S.ses={token:d.token, renova:d.renova, nome:d.nome, vence:d.vence, usuario, exp:expDe(d.token)};
    save(K_SES,S.ses);
    abrirPlayer();
  }catch(err){
    e.textContent=err.message==='Failed to fetch'?'Sem conexão com o servidor. Verifique sua internet.':err.message;
    e.classList.add('show');
  }finally{ b.textContent='Entrar' }
}
function abrirPlayer(){
  vigiarSessao();
  if(S.ses && !S.ses.exp) S.ses.exp=expDe(S.ses.token);
  $('gate').style.display='none';
  $('splash').style.display='flex';
  drawSaved();
  const last=load('cc_last',null), c=S.lists.find(x=>x.id===last);
  if(c) openList(c);
}
function expDe(tk){
  try{ return JSON.parse(atob(tk.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000 }
  catch(e){ return 0 }
}
/* renova o acesso em segundo plano, sem interromper o cliente */
async function renovarSessao(){
  if(!S.ses || !S.ses.renova) return false;
  if(S.renovando) return S.renovando;
  S.renovando = (async()=>{
    try{
      const r=await fetch(API+'/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({renova:S.ses.renova, dispositivo:idAparelho()})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.erro||'falhou');
      S.ses.token=d.token; S.ses.vence=d.vence; S.ses.exp=expDe(d.token);
      save(K_SES,S.ses);
      console.log('[Cine] sessão renovada');
      return true;
    }catch(e){
      console.warn('[Cine] não foi possível renovar:', e.message);
      S.motivoQueda = e.message;
      return false;
    }finally{ S.renovando=null }
  })();
  return S.renovando;
}
function vigiarSessao(){
  clearInterval(S.vigia);
  S.vigia=setInterval(()=>{
    if(!S.ses||!S.ses.exp) return;
    if(S.ses.exp - Date.now() < 3*3600000) renovarSessao();
  }, 15*60000);
}

function sessaoCaiu(){
  S.ses=null; localStorage.removeItem(K_SES);
  killEngines();
  $('app').classList.remove('show');
  $('splash').style.display='none';
  $('gate').style.display='flex';
  const e=$('gErr'); e.textContent=S.motivoQueda||'Sua sessão expirou. Entre novamente.'; e.classList.add('show');
}
function sairConta(){
  localStorage.removeItem(K_SES); localStorage.removeItem('cc_last');
  location.reload();
}

  $('formM3u').style.display = m==='m3u'?'block':'none';

function loginErr(msg){const e=$('loginErr');e.textContent=msg;e.classList.toggle('show',!!msg)}

function connect(){
  loginErr('');
  let cfg;
  if(S.mode==='m3u'){
    const url=$('m3uUrl').value.trim();
    if(!/^https?:\/\//i.test(url)) return loginErr('Informe a URL completa da lista, começando com http:// ou https://');
    cfg={id:Date.now()+'', type:'m3u', name:$('m3uName').value.trim()||'Minha lista', url};
  }else{
    let host=$('xtHost').value.trim().replace(/\/$/,'');
    const user=$('xtUser').value.trim(), pass=$('xtPass').value.trim();

    cfg={id:Date.now()+'', type:'xtream', name:$('xtName').value.trim()||'Minha lista', host, user, pass};
  }
  S.lists.push(cfg); save(K_LISTS,S.lists);
  openList(cfg);

function drawSaved(){
  const w=$('savedWrap'), l=$('savedList');
  if(!S.lists.length){w.style.display='none';return}
  w.style.display='block';
  l.innerHTML=S.lists.map(x=>`
    <div class="saved-item" onclick="openList(S.lists.find(z=>z.id==='${x.id}'))">
      <span class="pill">${x.type==='m3u'?'M3U':'XTREAM'}</span>
      <div class="nm"><b>${esc(x.name)}</b><span>${esc(x.type==='m3u'?x.url:x.host)}</span></div>
      <button class="del" onclick="event.stopPropagation();dropList('${x.id}')">✕</button>
    </div>`).join('');
}
function dropList(id){
  S.lists=S.lists.filter(x=>x.id!==id); save(K_LISTS,S.lists); drawSaved();
}

/* =========================================================
   CARREGAMENTO
   ========================================================= */
async function openList(cfg, forcar){
  if(!cfg) return;
  S.act=cfg; save('cc_last',cfg.id);
  busy(true,'Carregando '+cfg.name+'...','Listas grandes podem levar até um minuto. Não feche a página.');

  if(!forcar){
    const c=await cacheLer(cfg.id);
    console.log('[Cine] cache:', c ? Math.round((Date.now()-c.ts)/60000)+' min de idade' : 'vazio');
    if(c && (Date.now()-c.ts) < CACHE_HORAS*3600000){
      S.live=c.live; S.vod=c.vod; S.series=c.series; S.cats=c.cats; S.pronto=c.pronto||{live:true,vod:true,series:true};
      busy(false);
      $('splash').style.display='none';
      $('app').classList.add('show');
      go('live');
      return;
    }
  }

  try{
    if(cfg.type==='xtream') await loadXtream(cfg); else await loadM3U(cfg);
    cacheSalvar(cfg.id,{ts:Date.now(), live:S.live, vod:S.vod, series:S.series, cats:S.cats, pronto:S.pronto});
    busy(false);
    $('splash').style.display='none';
    $('app').classList.add('show');
    go('live');
  }catch(e){
    busy(false);
    $('splash').style.display='flex';
    loginErr(diagnose(e));
  }
}
function diagnose(e){
  const m=String((e&&(e.message||e.name))||e)+(e&&e.cause?' / '+e.cause:'');
  console.error('[Cine] falha ao carregar:', e);
  window.__ultimoErro = m;
  const mb = S.ultBytes ? ' Chegaram '+(S.ultBytes/1048576).toFixed(1)+' MB antes de parar.' : '';
  if(/abort|tempo/i.test(m))
    return 'A conexão com o provedor foi interrompida.'+mb+' Detalhe técnico: '+m;
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Não foi possível acessar o servidor. Isso quase sempre é bloqueio de CORS do provedor: configure a URL do proxy em Ajustes, ou confirme se o servidor está no ar.';
  if(/401|403/.test(m)) return 'Usuário ou senha recusados pelo provedor.';
  if(/404/.test(m)) return 'O servidor respondeu 404. Copie a URL inteira que o provedor mandou, com usuário, senha, a porta (ex.: :80 ou :8080) e o final &type=m3u_plus&output=ts.';
  return 'Falha ao carregar a lista. Detalhe técnico: '+m;
}

/* ---------- XTREAM ---------- */
function xtUrl(c,action,extra){
  return `${c.host}/player_api.php?username=${encodeURIComponent(c.user)}&password=${encodeURIComponent(c.pass)}`
    + (action?`&action=${action}`:'') + (extra||'');
}
async function loadXtream(c){
  const info = await grab(xtUrl(c,''),'json');
  if(!info || !info.user_info || info.user_info.auth===0) throw new Error('401');
  if(info.user_info.status && /expired|banned|disabled/i.test(info.user_info.status))
    throw new Error('Conta '+info.user_info.status+' no provedor.');
  c.exp = info.user_info.exp_date ? new Date(info.user_info.exp_date*1000) : null;
  c.maxCons = info.user_info.max_connections;
  c.activeCons = info.user_info.active_cons;

  const [lc,ls] = await Promise.all([
    grab(xtUrl(c,'get_live_categories'),'json').catch(()=>[]),
    grab(xtUrl(c,'get_live_streams'),'json').catch(()=>[])
  ]);
  const cmap = a => Object.fromEntries((a||[]).map(x=>[x.category_id, x.category_name]));
  const lm=cmap(lc);

  S.live = (ls||[]).map(x=>({
    id:'l'+x.stream_id, sid:x.stream_id, name:x.name, logo:x.stream_icon,
    num:x.num, cat:lm[x.category_id]||'Sem categoria', epgId:x.epg_channel_id,
    url:`${c.host}/live/${c.user}/${c.pass}/${x.stream_id}.m3u8`
  }));
  S.vod=[]; S.series=[]; S.pronto={live:true, vod:false, series:false};
  buildCats();
}

/* filmes e series entram so quando a aba e aberta */
async function carregarSecao(qual){
  const c=S.act;
  if(!c || c.type!=='xtream') return true;
  S.pronto = S.pronto || {live:true, vod:false, series:false};
  if(S.pronto[qual]) return true;

  busy(true, qual==='vod'?'Carregando filmes...':'Carregando séries...','Isso acontece só na primeira vez.');
  try{
    const cmap = a => Object.fromEntries((a||[]).map(x=>[x.category_id, x.category_name]));
    if(qual==='vod'){
      const [vc,vs]=await Promise.all([
        grab(xtUrl(c,'get_vod_categories'),'json').catch(()=>[]),
        grab(xtUrl(c,'get_vod_streams'),'json').catch(()=>[])
      ]);
      const vm=cmap(vc);
      S.vod=(vs||[]).map(x=>({
        id:'v'+x.stream_id, name:x.name, logo:x.stream_icon||x.cover,
        cat:vm[x.category_id]||'Sem categoria', rating:x.rating, year:x.year,
        url:`${c.host}/movie/${c.user}/${c.pass}/${x.stream_id}.${x.container_extension||'mp4'}`
      }));
    }else{
      const [sc,ss]=await Promise.all([
        grab(xtUrl(c,'get_series_categories'),'json').catch(()=>[]),
        grab(xtUrl(c,'get_series'),'json').catch(()=>[])
      ]);
      const sm=cmap(sc);
      S.series=(ss||[]).map(x=>({
        id:'s'+x.series_id, sid:x.series_id, name:x.name, logo:x.cover,
        cat:sm[x.category_id]||'Sem categoria', plot:x.plot, seasons:null
      }));
    }
    S.pronto[qual]=true;
    buildCats();
    cacheSalvar(c.id,{ts:Date.now(), live:S.live, vod:S.vod, series:S.series, cats:S.cats, pronto:S.pronto});
    busy(false);
    return true;
  }catch(e){
    busy(false); toast('Não foi possível carregar: '+diagnose(e).slice(0,70));
    return false;
  }
}
async function seriesInfo(item){
  if(item.seasons) return item.seasons;
  const c=S.act;
  const d = await grab(xtUrl(c,'get_series_info','&series_id='+item.sid),'json');
  const out={};
  Object.keys(d.episodes||{}).forEach(sn=>{
    out[sn]=(d.episodes[sn]||[]).map(e=>({
      ep:e.episode_num, name:e.title||('Episódio '+e.episode_num),
      url:`${c.host}/series/${c.user}/${c.pass}/${e.id}.${e.container_extension||'mp4'}`
    }));
  });
  item.seasons=out; return out;
}

/* ---------- M3U ---------- */
const RX_SER = [/^(.*?)[\s\-_.]*[SsTt](\d{1,2})[\s\-_.]*[EeXx](\d{1,3})/, /^(.*?)[\s\-_.]+(\d{1,2})[xX](\d{1,3})/];
function attr(line,k){const m=line.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''}

async function loadM3U(c){
  const txt = await grabTexto(c.url);
  if(!/#EXTM3U/i.test(txt.slice(0,600))) throw new Error('O arquivo retornado não é uma lista M3U válida.');
  const lines = txt.split(/\r?\n/);
  const live=[], vod=[], serEp=[];
  let cur=null, n=0;
  for(let i=0;i<lines.length;i++){
    const L=lines[i].trim();
    if(!L) continue;
    if(/^#EXTINF/i.test(L)){
      cur={ name:(L.split(',').slice(1).join(',')||'Sem nome').trim(),
            logo:attr(L,'tvg-logo'), cat:attr(L,'group-title')||'Sem categoria',
            epgId:attr(L,'tvg-id'), num:++n };
    }else if(L[0]!=='#' && cur){
      cur.url=L;
      const g=cur.cat.toLowerCase(), u=L.toLowerCase();
      const isVodExt=/\.(mp4|mkv|avi|mov|m4v)(\?|$)/.test(u);
      let type='live';
      if(u.includes('/series/')||/serie|season|temporada/.test(g)) type='series';
      else if(u.includes('/movie/')||/filme|movie|vod|cinema/.test(g)||isVodExt) type='vod';
      let m=null;
      for(const rx of RX_SER){ m=cur.name.match(rx); if(m) break }
      if(type==='series'||(m&&type!=='live')){
        if(m){ serEp.push({show:m[1].replace(/[\-_.]+$/,'').trim(), season:+m[2], ep:+m[3], ...cur}) }
        else { vod.push({id:'v'+i,...cur}) }
      }else if(type==='vod'){ vod.push({id:'v'+i,...cur}) }
      else { live.push({id:'l'+i,...cur}) }
      cur=null;
    }
  }
  const byShow={};
  serEp.forEach(e=>{
    const key=e.show.toLowerCase();
    if(!byShow[key]) byShow[key]={id:'s'+key, name:e.show, logo:e.logo, cat:e.cat, seasons:{}};
    const s=byShow[key];
    if(!s.seasons[e.season]) s.seasons[e.season]=[];
    s.seasons[e.season].push({ep:e.ep,name:e.name,url:e.url});
  });
  Object.values(byShow).forEach(s=>Object.values(s.seasons).forEach(a=>a.sort((x,y)=>x.ep-y.ep)));
  S.live=live; S.vod=vod; S.series=Object.values(byShow);
  S.pronto={live:true, vod:true, series:true};
  buildCats();
}

function buildCats(){
  const mk=arr=>{
    const m={};
    arr.forEach(x=>{m[x.cat]=(m[x.cat]||0)+1});
    return Object.entries(m).map(([name,ct])=>({name,ct})).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  };
  S.cats.live=mk(S.live); S.cats.vod=mk(S.vod); S.cats.series=mk(S.series);
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
async function go(tab){
  closeOverlay();
  if((tab==='vod'||tab==='series') && S.act && S.act.type==='xtream'){
    const ok=await carregarSecao(tab);
    if(!ok) return;
  }
  S.tab=tab; S.cat='all'; S.page=0;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  render();
}
function setCat(name){ S.cat=name; S.page=0; render() }
$('search').addEventListener('input', e=>{ S.q=e.target.value.trim().toLowerCase(); S.page=0; render() });

function dataFor(tab){
  let arr = tab==='live'?S.live : tab==='vod'?S.vod : tab==='series'?S.series : favList();
  if(S.cat!=='all') arr=arr.filter(x=>x.cat===S.cat);
  if(S.q) arr=arr.filter(x=>x.name.toLowerCase().includes(S.q));
  return arr;
}
function favList(){
  const ids=Object.keys(S.favs).filter(k=>S.favs[k]);
  const all=[...S.live,...S.vod,...S.series];
  return all.filter(x=>ids.includes(x.id));
}
function isFav(id){return !!S.favs[id]}
function toggleFav(id,ev){
  if(ev) ev.stopPropagation();
  S.favs[id]=!S.favs[id]; save(K_FAVS,S.favs);
  if(S.tab==='fav') render(); else document.querySelectorAll(`[data-star="${id}"]`).forEach(el=>el.classList.toggle('on',S.favs[id]));
}

function catsHTML(tab){
  const list = tab==='fav' ? [] : S.cats[tab]||[];
  const total = tab==='fav' ? favList().length : (tab==='live'?S.live:tab==='vod'?S.vod:S.series).length;
  return `<div class="cats">
    <button class="cat ${S.cat==='all'?'on':''}" tabindex="0" onclick="setCat('all')">Tudo <span class="ct">${total}</span></button>
    ${list.map(c=>`<button class="cat ${S.cat===c.name?'on':''}" tabindex="0" onclick="setCat(${JSON.stringify(c.name).replace(/"/g,'&quot;')})">${esc(c.name)} <span class="ct">${c.ct}</span></button>`).join('')}
  </div>`;
}

function render(){
  const m=$('main');
  const tab=S.tab;
  if(tab==='live' || (tab==='fav')){
    m.innerHTML = catsHTML(tab) + `<div class="pane" style="flex:1"><div class="chlist" id="chlist"></div></div>` + stageHTML();
    fillRows();
    if(S.cur) mountVideo();
  }else{
    m.innerHTML = catsHTML(tab) + `<div class="pane" style="flex:1"><div class="grid" id="grid"></div></div>`;
    fillGrid();
  }
}

/* ---------- listas de canais ---------- */
const BADPROTO=/^(rtmp|rtsp|udp|rtp|mms):/i;
function fillRows(reset=true){
  const box=$('chlist'); if(!box) return;
  const arr=dataFor(S.tab);
  if(reset){ box.innerHTML=''; S.page=0; }
  if(!arr.length){ box.innerHTML='<div class="empty">Nada por aqui. Troque a categoria ou limpe a busca.</div>'; return }
  const slice=arr.slice(S.page*120,(S.page+1)*120);
  box.insertAdjacentHTML('beforeend', slice.map(x=>{
    const bad=BADPROTO.test(x.url||'');
    const vod=x.id[0]!=='l';
    return `<div class="row ${S.cur&&S.cur.id===x.id?'on':''}" data-id="${x.id}" tabindex="0" onclick="pickRow('${x.id}')">
      ${x.num?`<span class="num mono">${x.num}</span>`:''}
      <img src="${esc(x.logo||'')}" onerror="this.style.visibility='hidden'" alt="">
      <div class="txt"><b>${esc(x.name)}</b><span>${esc(x.cat)}${bad?' · protocolo não suportado':''}</span></div>
      ${bad?'<span class="warnico">⚠</span>':''}
      <button class="star ${isFav(x.id)?'on':''}" data-star="${x.id}" onclick="toggleFav('${x.id}',event)">★</button>
    </div>`;
  }).join(''));
  S.page++;
  if(arr.length>S.page*120) addSentinel(box,()=>fillRows(false));
}
function addSentinel(box,cb){
  const s=document.createElement('div'); s.className='sentinel'; box.appendChild(s);
  if(S.io) S.io.disconnect();
  S.io=new IntersectionObserver(en=>{ if(en[0].isIntersecting){ S.io.disconnect(); s.remove(); cb() } },{root:box,rootMargin:'400px'});
  S.io.observe(s);
}
function pickRow(id){
  const it=[...S.live,...S.vod,...S.series,...favList()].find(x=>x.id===id);
  if(!it) return;
  if(it.seasons!==undefined && it.id[0]==='s') return openSeries(it);
  play(it);
}

/* ---------- grades de filmes e séries ---------- */
function fillGrid(reset=true){
  const box=$('grid'); if(!box) return;
  const arr=dataFor(S.tab);
  if(reset){ box.innerHTML='<div class="gwrap" id="gwrap"></div>'; S.page=0 }
  const w=$('gwrap');
  if(!arr.length){ box.innerHTML='<div class="empty">Nada por aqui. Troque a categoria ou limpe a busca.</div>'; return }
  const slice=arr.slice(S.page*60,(S.page+1)*60);
  w.insertAdjacentHTML('beforeend', slice.map(x=>`
    <div class="poster" tabindex="0" onclick="pickCard('${x.id}')">
      <div class="ph">${x.logo?`<img src="${esc(x.logo)}" loading="lazy" onerror="this.remove()" alt="">`:''}<span class="noimg">▣</span></div>
      <b>${esc(x.name)}</b>
    </div>`).join(''));
  S.page++;
  const old=box.querySelector('.sentinel'); if(old) old.remove();
  if(arr.length>S.page*60) addSentinel(box,()=>fillGrid(false));
}
function pickCard(id){
  const it=[...S.vod,...S.series].find(x=>x.id===id);
  if(!it) return;
  if(S.tab==='series'||id[0]==='s') openSeries(it); else play(it);
}

async function openSeries(item){

   ========================================================= */
function stageHTML(){

    <div class="videowrap">
      <video id="video" playsinline controls preload="none"></video>
      <div class="vstate" id="vstate"></div>

        </div>

      </div>
    </div>
    <div class="epg"><h4>Programação</h4><div id="epgBox"><div class="empty">Selecione um canal ao vivo.</div></div></div>
  </div>`;
}
function vstate(html){
  const v=$('vstate'); if(!v) return;
  v.innerHTML=html||''; v.classList.toggle('show',!!html);
}
function mountVideo(){ if(S.cur) play(S.cur,true) }
function ensureStage(){
  if($('video')) return;
  const ov=document.createElement('div'); ov.id='ovStage';
  ov.innerHTML='<button class="icobtn closeov" onclick="closeOverlay()">\u2715</button>'+stageHTML();
  document.body.appendChild(ov);
}
function closeOverlay(){
  const ov=$('ovStage'); if(!ov) return;
  killEngines();
  ov.remove(); S.cur=null;
}

function killEngines(){
  if(S.hls){ try{S.hls.destroy()}catch(e){} S.hls=null }
  if(S.ts){ try{S.ts.destroy()}catch(e){} S.ts=null }
}
/* converte http://host/user/pass/123 em http://host/live/user/pass/123.m3u8 */
function altHls(u){
  const m=String(u).split('?')[0].match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)(?:\.\w+)?$/);
  return m ? m[1]+'/live/'+m[2]+'/'+m[3]+'/'+m[4]+'.m3u8' : null;
}
function altTs(u){
  const m=String(u).split('?')[0].match(/^(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/]+)\/(\d+)\.m3u8$/);
  if(!m) return null;
  return [ m[1]+'/'+m[2]+'/'+m[3]+'/'+m[4], m[1]+'/'+m[2]+'/'+m[3]+'/'+m[4]+'.ts' ];
}

function play(item){
  S.cur=item;
  if(S.ses && S.ses.exp && S.ses.exp - Date.now() < 3*3600000) renovarSessao();
  ensureStage();
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on', r.dataset.id===item.id));
  if($('nowName')){ $('nowName').textContent=item.name; $('nowMeta').textContent=item.cat||'' }

  const u=item.url||'';
  if(BADPROTO.test(u)){
    vstate('<b>Canal em '+u.split(':')[0].toUpperCase()+'</b>'
      +'<p>Nenhum navegador reproduz esse protocolo. Peça ao provedor a versão HLS deste canal.</p>');
    return;
  }

  /* monta a fila de tentativas: engine + endereço */
  const live = item.id[0]==='l';
  const c=[];
  if(/\.m3u8(\?|$)/i.test(u)){
    c.push(['hls',u]);
    const t=altTs(u);
    if(live && t){ c.push(['ts',t[0]]); c.push(['ts',t[1]]) }
    c.push(['native',u]);
  }else if(/\.(mp4|mkv|avi|mov|m4v)(\?|$)/i.test(u)){
    c.push(['native',u]);
  }else{
    c.push(['ts',u]);
    const h=altHls(u); if(h) c.push(['hls',h]);
    c.push(['native',u]);
  }
  S.cands=c; S.errs=[]; S.token=(S.token||0)+1;
  tryPlay(0);
  if(live && S.act.type==='xtream' && item.sid) loadEpg(item);
  else if($('epgBox')) $('epgBox').innerHTML='<div class="empty">'+
    (live?'Esta lista não fornece guia de programação. Cadastre pela aba Xtream Codes para ter o guia.'
        :'Programação disponível apenas em canais ao vivo.')+'</div>';
}

function tryPlay(i){
  const v=$('video'); if(!v) return;
  const tk=S.token;
  killEngines();
  v.pause(); v.removeAttribute('src'); v.load();
  const c=S.cands&&S.cands[i];
  if(!c) return giveUp();
  const [engine,raw]=c;
  const url=px(raw);
  const live=S.cur.id[0]==='l';
  const nomes={hls:'HLS', ts:'MPEG-TS', native:'reprodução direta'};
  vstate('<div class="spin"></div><p>Conectando por '+nomes[engine]+
    (i>0?' (tentativa '+(i+1)+' de '+S.cands.length+')':'')+'...</p>');

  if(engine==='hls'){
    if(v.canPlayType('application/vnd.apple.mpegurl') && !(window.Hls&&Hls.isSupported())){
      v.src=url; v.oncanplay=ok; v.onerror=()=>{ note(i,'HLS nativo recusado'); tryPlay(i+1) }; return;
    }
    if(!(window.Hls&&Hls.isSupported())){ note(i,'hls.js indisponível'); return tryPlay(i+1) }
    S.hls=new Hls({maxBufferLength:24,manifestLoadingTimeOut:15000,fragLoadingTimeOut:20000,manifestLoadingMaxRetry:1});
    S.hls.loadSource(url); S.hls.attachMedia(v);
    S.hls.on(Hls.Events.MANIFEST_PARSED,ok);
    S.hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal) return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR){ try{S.hls.recoverMediaError();return}catch(e){} }
      note(i,'HLS '+d.details+(d.response&&d.response.code?' ('+d.response.code+')':''));
      tryPlay(i+1);
    });
    return;
  }

  if(engine==='ts'){
    if(!(window.mpegts && mpegts.getFeatureList().mseLivePlayback)){ note(i,'MSE indisponível neste navegador'); return tryPlay(i+1) }
    try{
      S.ts=mpegts.createPlayer({type:'mpegts',isLive:live,url},{enableStashBuffer:false,liveBufferLatencyChasing:true,lazyLoad:false});
      S.ts.attachMediaElement(v);
      S.ts.on(mpegts.Events.ERROR,(t,d,info)=>{ if(tk!==S.token) return; note(i,'TS '+t+' '+(d||'')+(info&&info.code?' ('+info.code+')':'')); tryPlay(i+1) });
      S.ts.on(mpegts.Events.MEDIA_INFO,ok);
      S.ts.load();
      try{ const r=S.ts.play(); if(r&&r.catch) r.catch(()=>askSound()) }catch(e){ askSound() }
      setTimeout(()=>{ if(tk!==S.token) return; if(v.readyState<2 && S.ts){ note(i,'TS sem dados em 14s'); tryPlay(i+1) } }, 14000);
    }catch(e){ note(i,'TS exceção: '+e.message); tryPlay(i+1) }
    return;
  }

  v.src=url;
  v.oncanplay=ok;
  v.onerror=()=>{ note(i,'Nativo: formato recusado pelo navegador'); tryPlay(i+1) };

  function ok(){ vstate(''); const r=v.play(); if(r&&r.catch) r.catch(()=>askSound()) }
}

async function checkCons(){
  try{
    const d=await grab(xtUrl(S.act,''),'json');
    const u=d&&d.user_info; if(!u) return;
    const el=$('consLine'); if(!el) return;
    el.innerHTML='<b style="color:var(--cyan)">'+(u.active_cons||0)+' de '+(u.max_connections||'?')
      +' conexões em uso agora.</b>';
  }catch(e){}
}
function note(i,msg){
  const c=(S.cands&&S.cands[i])||['?',''];
  (S.errs=S.errs||[]).push({eng:c[0], url:c[1], msg});
  console.warn('[Cine]', c[0], c[1], msg);
}
function diagHTML(){
  return (S.errs||[]).map(e=>
    '<div style="text-align:left;border-top:1px solid var(--line);padding:8px 0">'
    +'<b style="color:var(--cyan);font-size:.72rem;letter-spacing:.1em">'+e.eng.toUpperCase()+'</b>'
    +'<div style="font-size:.74rem;color:var(--muted);word-break:break-all">'+esc(e.url)+'</div>'
    +'<div style="font-size:.74rem;color:#FFB3BC">'+esc(e.msg)+'</div></div>').join('');
}
function giveUp(){
  const errs=(S.errs||[]).map(e=>e.msg).join(' ');
  const only403 = /403/.test(errs) && !/404/.test(errs);
  const txt = only403
    ? 'O provedor respondeu 403 em todas as tentativas. Quase sempre é limite de conexões: feche o player em outros aparelhos, aguarde um minuto e tente de novo. Se persistir só neste canal, ele está fora do ar ou não faz parte do seu plano.'
    : 'Tentei HLS, MPEG-TS e reprodução direta. O canal pode estar fora do ar, ou o vídeo está em HEVC, que só roda no Chrome e no Safari.';
  if(only403 && S.act && S.act.type==='xtream') checkCons();
  vstate('<b>'+(only403?'Acesso recusado pelo provedor':'Não foi possível reproduzir')+'</b>'
    +'<p id="consLine"></p><p>'+txt+'</p>'
    +'<button class="btn ghost" style="max-width:200px" onclick="play(S.cur)">Tentar de novo</button>'
    +'<button class="btn ghost" style="max-width:200px" onclick="this.nextElementSibling.style.display=\'block\';this.style.display=\'none\'">Ver detalhes técnicos</button>'
    +'<div style="display:none;max-width:520px;max-height:180px;overflow:auto">'+diagHTML()+'</div>');
}
function askSound(){
  const v=$('video'); v.muted=true; v.play().catch(()=>{});
  vstate('<button class="btn" style="max-width:220px" onclick="$(\'video\').muted=false;$(\'video\').play();vstate(\'\')">Toque para ouvir</button>');
}
function toggleFS(){
  const el=$('stage');
  if(!document.fullscreenElement) (el.requestFullscreen?el.requestFullscreen():$('video').webkitEnterFullscreen&&$('video').webkitEnterFullscreen());
  else document.exitFullscreen();
}
async function loadEpg(item){
  const box=$('epgBox'); if(!box) return;
  box.innerHTML='<div class="empty">Buscando programação...</div>';
  try{
    const d=await grab(xtUrl(S.act,'get_short_epg','&stream_id='+item.sid+'&limit=8'),'json');
    const l=(d&&d.epg_listings)||[];
    if(!l.length){ box.innerHTML='<div class="empty">Sem guia para este canal. O provedor não publicou a programação.</div>'; return }
    const now=Date.now()/1000;
    box.innerHTML=l.map(p=>{
      const st=+p.start_timestamp, en=+p.stop_timestamp;
      const t=new Date(st*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const b64=s=>{try{return decodeURIComponent(escape(atob(s||'')))}catch(e){return s||''}};
      return `<div class="prog ${now>=st&&now<en?'live':''}">
        <span class="tm mono">${t}</span>
        <div class="pd"><b>${esc(b64(p.title))}</b><span>${esc(b64(p.description)).slice(0,140)}</span></div></div>`;
    }).join('');
  }catch(e){ box.innerHTML='<div class="empty">Não foi possível carregar o guia.</div>' }
}

/* =========================================================
   MODO TV (navegação espacial por setas)
   ========================================================= */
const SEL='.row,.cat,.poster,.btn,.navi,.ep,.icobtn,.seasons button';
document.addEventListener('keydown',e=>{
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Backspace'].includes(e.key)) return;
  const act=document.activeElement;
  if(act && act.tagName==='INPUT' && e.key!=='ArrowDown') return;
  if(e.key==='Backspace'){ if($('mask').classList.contains('show')){ closeSheet(); e.preventDefault() } return }
  if(e.key==='Enter'){ if(act&&act.click){act.click()} return }
  e.preventDefault();
  const items=[...document.querySelectorAll(SEL)].filter(el=>el.offsetParent!==null);
  if(!items.length) return;
  const cur=items.includes(act)?act:items[0];
  if(!items.includes(act)){ focus(items[0]); return }
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null,bd=Infinity;
  items.forEach(el=>{
    if(el===cur) return;
    const b=el.getBoundingClientRect(), bx=b.left+b.width/2, by=b.top+b.height/2;
    const dx=bx-cx, dy=by-cy;
    const ok = e.key==='ArrowUp'?dy<-4 : e.key==='ArrowDown'?dy>4 : e.key==='ArrowLeft'?dx<-4 : dx>4;
    if(!ok) return;
    const axis=(e.key==='ArrowUp'||e.key==='ArrowDown')?Math.abs(dy)+Math.abs(dx)*2.5:Math.abs(dx)+Math.abs(dy)*2.5;
    if(axis<bd){bd=axis;best=el}
  });
  if(best) focus(best);
});
function focus(el){
  document.querySelectorAll('.kfoc').forEach(x=>x.classList.remove('kfoc'));
  el.classList.add('kfoc'); el.focus({preventScroll:true});
  el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
